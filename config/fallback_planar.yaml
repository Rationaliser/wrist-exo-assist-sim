# FALLBACK B configuration: minimal planar wrist model built in code
# (route_a_moco/build_planar_model.py). Used only while MoBL-ARMS is unavailable
# (SimTK account pending approval, 2026-11-02). All outputs are tagged "fallbackB".

model:
  path: models/planar_wrist_fallbackB.osim   # generated by build_planar_model.py (gitignored, regenerable)
  source: "generated in code (fallback B); no third-party model file"
  licence: "own work (repo licence)"
  opensim_version: "4.6"

names:                                    # defined by build_planar_model.py
  wrist_flexion: wrist_flexion
  wrist_deviation: null
  forearm_rotation: null
  elbow_flexion: null
  hand_body: hand
  wrist_extensors: [EXT_lumped]
  wrist_flexors: [FLX_lumped]

posture:                                  # forearm welded horizontal and pronated (palm down) in the model
  free_wrist_deviation: false
  locked_deg: {}

planar:
  # Sources: [M] = MyoSuite MyoHand model (myo_sim 0.2.3, derived from MoBL-ARMS), values read
  #   from the installed package / measured in results/myosuite_smoke.md (moment arms at reset pose).
  # [W] = Winter DA (2009) Biomechanics and Motor Control of Human Movement, 4th ed., Table 4.1
  #   (segment mass fraction / COM / radius of gyration), for a 75 kg adult.
  # [A] = assumption (literature-plausible, not checked against a primary table).
  wrist_range_deg: [-60, 70]              # [A] functional range, - = extension
  forearm:                                # welded to ground, so its inertia does not affect the solve
    mass_kg: 1.2                          # [W] 0.016 x 75 kg
    length_m: 0.26                        # [A]
    com_from_wrist_m: 0.15                # [W] 0.430 from elbow => 0.57 x length from wrist
    rog: 0.303                            # [W]
  hand:
    mass_kg: 0.45                         # [W] 0.006 x 75 kg
    length_m: 0.11                        # [A] wrist axis to knuckle II
    com_from_wrist_m: 0.056               # [W] 0.506 x length
    rog: 0.297                            # [W]
  muscles:
    - name: EXT_lumped                    # ECRL + ECRB + ECU
      side: dorsal
      max_isometric_force_n: 782.4        # [M] 337.3 + 252.2 + 192.9
      moment_arm_m: 0.0118                # [M] force-weighted mean of 11.7, 15.3, 7.5 mm
      optimal_fiber_length_m: 0.07        # [A] wrist extensors ~6-8 cm
      origin_from_wrist_m: 0.28           # [A] lateral epicondyle region; gives l_MT ~0.30 m ([M] length range 0.27-0.34 m)
      insertion_from_wrist_m: 0.015       # [A] metacarpal bases
    - name: FLX_lumped                    # FCR + FCU
      side: palmar
      max_isometric_force_n: 887.7        # [M] 407.9 + 479.8
      moment_arm_m: 0.0185                # [M] force-weighted mean of 18.5, 18.4 mm
      optimal_fiber_length_m: 0.06        # [A] wrist flexors ~5-6 cm
      origin_from_wrist_m: 0.28           # [A] medial epicondyle region
      insertion_from_wrist_m: 0.015       # [A]
  # tendon slack length: set so fibres are at optimal length at 0 deg wrist angle [A]

cup:
  mass_kg: 0.3
  # cylinder approximating a filled mug held in the palm
  radius_m: 0.04
  height_m: 0.10
  offset_in_hand_m: [0.08, -0.04, 0.0]    # 8 cm distal, 4 cm palmar (hand frame: x distal, +y dorsal)

task:
  start_deg: 30.0                         # + = flexion (dropped wrist)
  end_deg: -15.0                          # - = extension (functional)
  duration_s: 1.0
  hold_fraction: 0.3                      # last 30 % of the motion is a hold at end_deg
  track_weight: 100.0                     # weight of wrist-angle tracking (min-jerk move + hold reference)

actuation: muscles                        # "muscles" (primary) or "torque" (fallback A)
torque_actuator:                          # only for actuation: torque
  optimal_force_nm: 5.0
  bound: 1.0

muscles:
  model: DeGrooteFregly2016
  ignore_tendon_compliance: true
  ignore_passive_fiber_force: false
  strength_factor: 1.0                    # hook for the P3 weakness sweep

reserves:
  optimal_force_nm: 1.0                   # small optimal force => large control => heavily penalised
  bound: 50.0
  effort_weight: 1.0                      # control effort weight; reserve controls get this x reserve_weight
  reserve_weight: 1000.0

solver:
  num_mesh_intervals: 30
  refine_mesh_intervals: 60
  transcription: hermite-simpson
  optim_convergence_tolerance: 1.0e-3
  optim_constraint_tolerance: 1.0e-3
  max_iterations: 2000
  parallel: 4
